# /etc/nginx/sites-available/civic.conf
# The Hardin Civic — nginx vhost
#
# Architecture:
#   Cloudflare Tunnel  →  127.0.0.1:8080 (this server)  →  PHP-FPM (unix socket)
#
# The VPS has NO public-facing port 80/443 open in its firewall. Cloudflare
# Tunnel makes the outbound connection, so the origin IP is hidden. Tailscale
# (CGNAT 100.64.0.0/10) is the only way to reach /admin/.
#
# After dropping in: `sudo ln -s ../sites-available/civic.conf /etc/nginx/sites-enabled/`
# then `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root /var/www/civic/public;
    index index.php;

    # Hardening: hide nginx version, restrict request size
    server_tokens off;
    client_max_body_size 4m;

    # Static assets — long cache, no PHP, no logging
    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Block dotfiles (.env, .git, etc.) absolutely
    location ~ /\. {
        deny all;
        log_not_found off;
        access_log off;
    }

    # Front controller: every URL that isn't a real file → index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Admin namespace — Tailscale or localhost ONLY.
    # Even if PHP has a bug, the internet can't reach /admin/*.
    location /admin/ {
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;            # Tailscale CGNAT range
        deny  all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP execution — only via index.php in DOCUMENT_ROOT
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT  $realpath_root;

        # Pass real client IP from Cloudflare. Match this var name in PHP:
        # see src/bootstrap.php::ip_hash().
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;

        # Hide PHP version
        fastcgi_hide_header X-Powered-By;
    }

    # Security headers — applied to every response. Tune CSP after the AI
    # client lands (it'll fetch from /ask, which is same-origin — so default
    # 'self' should still work).
    add_header X-Content-Type-Options nosniff           always;
    add_header X-Frame-Options          SAMEORIGIN      always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    # CSP: allow Google Fonts (we use it); inline styles for the SVG bg.
    add_header Content-Security-Policy  "default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}
